[project]
name = "uva-pra"
version = "0.1.0"
description = "UVA Vision: drone video alerting kernel (YOLO + Qwen-VL) with local web workbench."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thunder", email = "alice@example.com" }]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
gpu = [
    "ultralytics>=8.4",
    "torch",
    "torchvision",
    "huggingface-hub>=0.20",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
uva = "uva.cli:main"
uva-pra = "uva_pra.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
